# 1.基本配置
faction: "red"
enable_vision_localization: false # 是否开启主相机视觉定位；false 时只用信息波坐标
use_sub_camera: true
enable_referee: true
enable_laser_tracking: true
enable_demod: true # 是否开启解调信息波

referee:
  port: /dev/ttyUSB0
  baudrate: 115200
  double_vulnerability_trigger_after_start_seconds: [60, 120] # 第1/2次双倍易伤分别在开局后多少秒允许触发
  radar2robot:
    enabled: true # 是否周期性给己方机器人发送雷达位置/状态；不影响0x0305裁判客户端坐标和密钥/双倍易伤控制消息
    receivers: ["all"] # all / hero / engineer / infantry3 / infantry4 / drone / sentry
    send_location: false
    send_status: true
    batch_interval: 0.7
    tx_interval: 0.1
  radar2client:
    tx_interval: 0.1 # 雷达 -> 裁判系统坐标发送周期，0.2s = 5Hz，符合 0x0305 频率上限

initiative_counter: false # true: 按 countermeasure_start_seconds 或飞镖信号分次反制；false: 开局直接持续反制
countermeasure_start_seconds: # initiative_counter=true 时，第1~5次反制分别在开局后多少秒启动
  - 0
  - 0
  - 0
  - 180
  - 180
record_main: false # 启动录制能压一半帧率fule
record_sub: true

demod: # 解调信息波
  listen_host: 0.0.0.0
  listen_port: 9999
  target_level: 3
  decode_timeout: 30.0 # 解调密钥超时时间，和 RX/AGENTS.md 中 30s 设计一致
  demod_timeout: 1.0 # 解调位置结果超时时间

use_video: false
video_path: "/path/to/your/video.mp4"

device: "cuda"
class_names: ["R1", "R2", "R3", "R4", "R7", "B1", "B2", "B3", "B4", "B7", "RA", "BA"]

# 2.射线投影
transform:  # 2026RMUC地图
  mesh_path: "config/field/RMUC2026_V1.2.0_copy_m.PLY"
  keypoints_file: "config/keypoints/RMUC2026_keypoints.pp"
  map_path: "config/field/RM2026Map.png"

# 3.模型
car_detector:
  weights_path: "weights/car26.engine" # Path to the car detection model weights
  img_size: 640
  conf_thres: 0.2
  iou_thres: 0.5
  max_det: 10
  tracker_config_path: "config/botsort.yaml" # Path to the tracker configuration file

aircraft_detector:
  weights_path: "weights/yolov12n-aircraft.engine"
  img_size: 1280
  conf_thres: 0.5
  iou_thres: 0.5
  max_det: 2
  tracker_config_path: "config/botsort.yaml"

armor_detector:
  weights_path: "weights/armor26.engine"
  digit_model_type: "mobilenet"
  digit_weights_path: "weights/MobileNet_v3.1.pth"

  use_enhanced_detector: true
  armor_detector_type: "two_step" # three_step, three_step
  img_size: 192

  conf_thres: 0.5
  iou_thres: 0.4
  max_det: 1

tracker:
  point_guesser_config_path: "config/guess_pts.yaml"

